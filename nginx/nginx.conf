# ─────────────────────────────────────────────────────────────
# NetSentinel — Nginx Reverse Proxy Configuration
# ─────────────────────────────────────────────────────────────
# What this does:
#   - Listens on port 80 (public internet)
#   - Routes /api/* requests  → FastAPI backend (port 8000)
#   - Routes everything else  → Next.js frontend (port 3000)
#   - Adds security headers on every response
# ─────────────────────────────────────────────────────────────

# Number of worker processes (auto = one per CPU core)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml
               application/xml text/javascript;

    # ── Upstream services ────────────────────────────────────
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────
    server {
        listen 80;
        server_name netsentinel.duckdns.org;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name netsentinel.duckdns.org;

        # ── SSL certificates (from Certbot) ──────────────────
        ssl_certificate     /etc/letsencrypt/live/netsentinel.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/netsentinel.duckdns.org/privkey.pem;

        # ── SSL settings ──────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ──────────────────────────────────
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 10M;

        # ── Route: /api/* → FastAPI backend ──────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Route: /health → backend health check ────────────
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # ── Route: everything else → Next.js frontend ────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Static file caching ───────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /images/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400";
        }
    }
}