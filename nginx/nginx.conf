# ─────────────────────────────────────────────────────────────
# NetSentinel — Nginx Reverse Proxy Configuration
# ─────────────────────────────────────────────────────────────
# What this does:
#   - Listens on port 80 (public internet)
#   - Routes /api/* requests  → FastAPI backend (port 8000)
#   - Routes everything else  → Next.js frontend (port 3000)
#   - Adds security headers on every response
# ─────────────────────────────────────────────────────────────

# Number of worker processes (auto = one per CPU core)
worker_processes auto;

events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

http {

    # ── MIME types ──────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Performance ─────────────────────────────────────────
    sendfile        on;
    keepalive_timeout 65;

    # ── Hide Nginx version from error pages ─────────────────
    server_tokens off;

    # ── Gzip compression ────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml
               application/xml text/javascript;

    # ── Upstream services (Docker service names) ────────────
    # These names match the service names in docker-compose.yml
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # ── Main server block ────────────────────────────────────
    server {
        listen 80;

        # Replace with your Oracle VM public IP or domain
        # For now _ means "accept any hostname"
        server_name _;

        # ── Security headers ──────────────────────────────
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "no-referrer-when-downgrade" always;

        # ── Client upload limit ───────────────────────────
        client_max_body_size 10M;

        # ── Route: /api/* → FastAPI backend ──────────────
        location /api/ {
            proxy_pass         http://backend;

            # Pass real client info to FastAPI
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Route: /health → backend health check ─────────
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # ── Route: everything else → Next.js frontend ────
        location / {
            proxy_pass         http://frontend;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Required for Next.js hot reload in dev (websocket)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Static file caching ───────────────────────────
        # Next.js static assets — cache aggressively
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;

            # Cache for 1 year — Next.js hashes filenames
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public folder assets
        location /images/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400";
        }
    }
}