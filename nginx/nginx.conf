# ─────────────────────────────────────────────────────────────
# NetSentinel — Nginx Reverse Proxy Configuration
# ─────────────────────────────────────────────────────────────
# Routes:
#   /api/*        → FastAPI backend  (port 8000)
#   /health       → FastAPI backend  (port 8000)
#   /_next/static → Next.js frontend (port 3000, cached)
#   /images/      → Next.js frontend (port 3000, cached)
#   /*            → Next.js frontend (port 3000)
#
# Security headers are intentionally omitted here.
# FastAPI's SecurityHeadersMiddleware sets them with stricter
# values (DENY vs SAMEORIGIN, HSTS with preload, full CSP, etc.)
# Having both nginx AND FastAPI set the same headers causes
# duplicate/conflicting header values in the browser.
# ─────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml
               application/xml text/javascript;

    # ── Upstream services ────────────────────────────────────
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────
    server {
        listen 80;
        server_name netsentinel.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name netsentinel.duckdns.org;

        # SSL certificates (from Certbot / Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/netsentinel.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/netsentinel.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 10M;

        # ── /api/* → FastAPI backend ──────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── /health → backend health check ───────────────────
        location /health {
            proxy_pass       http://backend;
            proxy_set_header Host $host;
        }

        # ── Static Next.js assets (long-lived cache) ─────────
        location /_next/static/ {
            proxy_pass       http://frontend;
            proxy_set_header Host $host;
            add_header       Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Public images (short cache) ───────────────────────
        location /images/ {
            proxy_pass       http://frontend;
            proxy_set_header Host $host;
            add_header       Cache-Control "public, max-age=86400";
        }

        # ── Everything else → Next.js frontend ───────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}