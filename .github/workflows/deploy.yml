# ─────────────────────────────────────────────────────────────
# NetSentinel — Deploy Pipeline
# ─────────────────────────────────────────────────────────────
# TRIGGERS: Only runs when code is pushed/merged to main branch
#
# WHAT IT DOES:
#   1. Runs the full CI pipeline first (tests + builds)
#   2. If CI passes — SSHs into Oracle VM
#   3. Runs deploy.sh on the server (pull + restart containers)
#   4. Confirms the app is live
#
# REQUIRED GITHUB SECRETS (set in repo Settings → Secrets):
#   ORACLE_VM_IP        — your Oracle VM public IP address
#   ORACLE_SSH_KEY      — your private SSH key (for VM access)
#   ORACLE_VM_USER      — VM username (usually "ubuntu")
# ─────────────────────────────────────────────────────────────

name: Deploy — Oracle VM

on:
  push:
    branches: [main]       # Only deploy on push to main

jobs:

  # ── Job 1: Run full CI first ───────────────────────────────
  # Reuse the same checks from ci.yml before deploying
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - name: Run flake8
        working-directory: backend
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --exclude=__pycache__ \
            --exit-zero \
            --count --statistics

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Create test .env
        working-directory: backend
        run: |
          cp .env.example .env
          echo "DATABASE_URL=sqlite:///./test.db" >> .env
          echo "JWT_SECRET_KEY=test-secret-key-for-ci-only" >> .env
          echo "SEARXNG_URL=http://localhost:8080" >> .env
      - name: Run pytest
        working-directory: backend
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests found — skipping."
          fi

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  # ── Job 2: Deploy to Oracle VM ─────────────────────────────
  # Only runs after ALL CI jobs pass
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]   # Both must pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Set up SSH key ──────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_vm
          chmod 600 ~/.ssh/oracle_vm
          ssh-keyscan -H ${{ secrets.ORACLE_VM_IP }} >> ~/.ssh/known_hosts

      # ── SSH into VM and run deploy script ───────────────
      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/oracle_vm \
              -o StrictHostKeyChecking=no \
              ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }} \
              "bash /home/${{ secrets.ORACLE_VM_USER }}/NetSentinel/scripts/deploy.sh"

      # ── Wait for app to come up ─────────────────────────
      - name: Wait for app to start
        run: sleep 20

      # ── Health check — confirm app is live ──────────────
      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://netsentinel.duckdns.org/health) \
            --insecure)

          if [ "$STATUS" = "200" ]; then
            echo "✅ Deployment successful! App is live."
            echo "🌐 URL: https://netsentinel.duckdns.org"
          else
            echo "❌ Health check failed. HTTP status: $STATUS"
            exit 1
          fi

      # ── Post deployment summary ─────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "========================================"
          echo "  DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "  Branch : main"
          echo "  Server : ${{ secrets.ORACLE_VM_IP }}"
          echo "  URL    : http://${{ secrets.ORACLE_VM_IP }}"
          echo "  Time   : $(date)"
          echo "========================================"