# ─────────────────────────────────────────────────────────────
# NetSentinel — CI Pipeline
# ─────────────────────────────────────────────────────────────
# TRIGGERS: Runs on every push and pull request to any branch
#
# JOBS:
#   1. lint-backend    — checks Python code style
#   2. test-backend    — runs pytest on FastAPI app
#   3. lint-frontend   — checks TypeScript types
#   4. build-frontend  — verifies Next.js builds successfully
#   5. docker-build    — verifies Docker images build correctly
# ─────────────────────────────────────────────────────────────

name: CI — Test & Build

on:
  push:
    branches: ["**"]        # Run on every branch push
  pull_request:
    branches: [main]        # Run on PRs targeting main

jobs:

  # ── Job 1: Python linting ──────────────────────────────────
  lint-backend:
    name: Lint Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 linter
        working-directory: backend
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --exclude=__pycache__ \
            --count \
            --statistics

  # ── Job 2: Backend tests ───────────────────────────────────
  test-backend:
    name: Test Backend (pytest)
    runs-on: ubuntu-latest
    needs: lint-backend       # Only run if linting passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create test .env file
        working-directory: backend
        run: |
          cp .env.example .env
          # Use SQLite for testing — no real Postgres needed in CI
          echo "DATABASE_URL=sqlite:///./test.db" >> .env
          echo "JWT_SECRET_KEY=test-secret-key-for-ci-only" >> .env
          echo "SEARXNG_URL=http://localhost:8080" >> .env

      - name: Run pytest
        working-directory: backend
        run: |
          # Run tests if they exist, otherwise skip gracefully
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests directory found — skipping."
            echo "TIP: Create backend/tests/ to enable automated testing."
          fi

  # ── Job 3: Frontend type checking ─────────────────────────
  lint-frontend:
    name: Lint Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Job 4: Frontend build check ────────────────────────────
  build-frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: lint-frontend      # Only run if type check passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js app
        working-directory: frontend
        env:
          # Dummy URL for build check — no real backend needed
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  # ── Job 5: Docker build check ──────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    # Only run after both backend and frontend checks pass
    needs: [test-backend, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create backend .env for Docker build
        working-directory: backend
        run: |
          cp .env.example .env
          echo "JWT_SECRET_KEY=test-secret-key-for-ci-only" >> .env

      - name: Build backend Docker image
        run: |
          docker build \
            --tag netsentinel-backend:ci \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --tag netsentinel-frontend:ci \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 \
            ./frontend

      - name: Build nginx Docker image
        run: |
          docker build \
            --tag netsentinel-nginx:ci \
            ./nginx

      - name: Confirm all images built
        run: docker images | grep netsentinel