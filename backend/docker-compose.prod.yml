# ─────────────────────────────────────────────────────────────
# docker-compose.prod.yml — Production overrides
# ─────────────────────────────────────────────────────────────
# HOW TO USE:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — no external port in production ─────────────
  db:
    ports: []
    expose:
      - "5432"

  # ── SearXNG — no external port in production ───────────────
  searxng:
    ports: []
    expose:
      - "8080"

  # ── Backend — production mode ───────────────────────────────
  backend:
    volumes: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    ports: []
    expose:
      - "8000"

  # ── Frontend — production build ─────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://141.147.71.36
    ports: []
    expose:
      - "3000"

  # ── Nginx — only exists in production ──────────────────────
  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    container_name: netsentinel_nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped